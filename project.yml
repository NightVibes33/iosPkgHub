name: PKGSender
options:
  bundleIdPrefix: com.mrw
  deploymentTarget:
    iOS: "16.0"
targets:
  PKGSender:
    type: application
    platform: iOS
    sources:
      - path: PKGSender
      - path: pkgusb.elf
        buildPhase: resources
      - path: payload.json
        buildPhase: resources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.pkgsender.app
      INFOPLIST_FILE: PKGSender/Info.plist
      SWIFT_VERSION: 5.0
      TARGETED_DEVICE_FAMILY: "1,2"
      CODE_SIGN_STYLE: Manual
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO

  PKGSenderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PKGSenderTests
    dependencies:
      - target: PKGSender
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.mrw.PKGSenderTests
      GENERATE_INFOPLIST_FILE: YES

schemes:
  PKGSender:
    build:
      targets:
        PKGSender: all
    test:
      targets:
        - PKGSenderTests
